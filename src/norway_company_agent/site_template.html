<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Signalpost explorer: find, compare and verify sourced profiles of Norwegian companies.">
<title>Signalpost Explorer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e40af'/%3E%3Cpath d='M9 22V10h3v12zm5.500 0V14h3v8zm5.500 0v-5h3v5z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f8fafc; --surface: #ffffff; --raised: #f1f5f9; --text: #0f172a; --muted: #475569; --line: #e2e8f0; --line-strong: #cbd5e1; --control: #7f8ea6;
  --accent: #1e40af; --accent-soft: #e0e9ff; --on-accent: #ffffff;
  --ok: #166534; --ok-soft: #dcfce7; --warn: #92400e; --warn-soft: #fef3c7; --bad: #991b1b; --bad-soft: #fee2e2; --na: #475569; --na-soft: #eef2f7;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --radius: 10px; --radius-s: 6px; --shadow: 0 1px 2px rgba(15,23,42,.06), 0 2px 8px rgba(15,23,42,.04);
  --z-header: 20; --z-bar: 30; --z-skip: 100;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --tap: 36px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220; --surface: #111a2e; --raised: #18233b; --text: #e6eaf2; --muted: #a3b0c6; --line: #24304a; --line-strong: #34425f; --control: #5f7092;
    --accent: #93b4ff; --accent-soft: #1b2a4d; --on-accent: #0b1220;
    --ok: #86efac; --ok-soft: #12301f; --warn: #fcd34d; --warn-soft: #3a2c0c; --bad: #fca5a5; --bad-soft: #3b1717; --na: #a3b0c6; --na-soft: #1b2438;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #111a2e; --raised: #18233b; --text: #e6eaf2; --muted: #a3b0c6; --line: #24304a; --line-strong: #34425f; --control: #5f7092;
  --accent: #93b4ff; --accent-soft: #1b2a4d; --on-accent: #0b1220;
  --ok: #86efac; --ok-soft: #12301f; --warn: #fcd34d; --warn-soft: #3a2c0c; --bad: #fca5a5; --bad-soft: #3b1717; --na: #a3b0c6; --na-soft: #1b2438;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
@media (pointer: coarse) { :root { --tap: 44px; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button, select, input { font: inherit; color: inherit; touch-action: manipulation; }
button { cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: var(--s2); top: -60px; z-index: var(--z-skip); background: var(--accent); color: var(--on-accent); padding: var(--s2) var(--s4); border-radius: var(--radius-s); }
.skip:focus { top: var(--s2); }

header { position: sticky; top: 0; z-index: var(--z-header); background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { max-width: 1200px; margin: 0 auto; padding: var(--s3) var(--s4); display: flex; gap: var(--s3); align-items: center; }
.brand { font-weight: 700; letter-spacing: -.01em; font-size: 17px; color: var(--text); white-space: nowrap; }
.brand span { color: var(--muted); font-weight: 500; }
.search { flex: 1 1 260px; min-width: 0; }
input[type=search] { width: 100%; min-height: var(--tap); padding: 7px 12px; border: 1px solid var(--control); border-radius: 8px; background: var(--bg); font-size: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); padding: 0 12px; border: 1px solid var(--control); background: var(--surface); border-radius: 8px; font-size: 14px; white-space: nowrap; transition: background-color .15s, border-color .15s; }
.btn:hover { background: var(--raised); text-decoration: none; } .btn:active { background: var(--accent-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.icon { width: var(--tap); padding: 0; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

main { max-width: 1200px; margin: 0 auto; padding: var(--s4); }
main:focus, main:focus-visible, h1:focus, h1:focus-visible, h2[tabindex]:focus-visible { outline: none; }
a.src { color: inherit; text-decoration: underline dotted var(--line-strong); text-underline-offset: 3px; }
a.src:hover { color: var(--accent); text-decoration: underline solid; }
main.has-bar { padding-bottom: 96px; }
.toolbar { display: flex; gap: var(--s2) var(--s3); align-items: center; flex-wrap: wrap; margin-bottom: var(--s3); }
.chips { display: flex; gap: var(--s2); flex-wrap: wrap; flex: 1 1 0; min-width: 260px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); border: 1px solid var(--control); background: var(--surface); border-radius: 999px; padding: 0 12px; font-size: 13px; white-space: nowrap; transition: background-color .15s, border-color .15s; }
.chip:hover { background: var(--raised); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
.tools { display: flex; gap: var(--s2) var(--s3); align-items: center; }
.sort { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
select { min-height: var(--tap); padding: 0 8px; border: 1px solid var(--control); border-radius: 8px; background: var(--surface); font-size: 14px; }
.meta { color: var(--muted); font-size: 13px; margin: 0 0 var(--s3); display: flex; justify-content: space-between; gap: var(--s2) var(--s4); flex-wrap: wrap; align-items: center; }
.legend { display: inline-flex; gap: var(--s3); flex-wrap: wrap; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow-wrap: break-word; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; background: var(--surface); white-space: nowrap; }
thead th.num { text-align: right; }
th button.sortbtn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; min-height: 24px; }
th button.sortbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
th[aria-sort="ascending"] .sortbtn::after { content: "▲"; font-size: 9px; } th[aria-sort="descending"] .sortbtn::after { content: "▼"; font-size: 9px; }
th[aria-sort] { color: var(--text); }
table.list tbody tr { cursor: pointer; transition: background-color .15s; } table.list tbody tr:hover { background: var(--raised); }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.neg { color: var(--bad); }
.name { font-weight: 600; color: var(--text); } a.name:hover { color: var(--accent); }
.sub { color: var(--muted); font-size: 12.5px; }
.pick { display: inline-flex; align-items: center; justify-content: center; width: var(--tap); height: var(--tap); margin: -8px; cursor: pointer; }
.pick input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
.cov { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.cov b { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; min-width: 34px; }
.dots { display: inline-flex; gap: 3px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: transparent; border: 1.5px solid var(--control); flex: none; }
.dot.available { background: var(--ok); border-color: var(--ok); }
.dot.ambiguous { background: var(--warn); border-color: var(--warn); border-radius: 1px; transform: rotate(45deg) scale(.85); }
.dot.failed, .dot.blocked { background: var(--bad); border-color: var(--bad); border-radius: 1px; }
.dot.not_applicable { border-style: dotted; }
.badge { display: inline-block; font-size: 12px; line-height: 1.5; padding: 1px 8px; border-radius: 999px; background: var(--na-soft); color: var(--na); white-space: nowrap; }
.badge.available { background: var(--ok-soft); color: var(--ok); } .badge.failed, .badge.blocked { background: var(--bad-soft); color: var(--bad); }
.badge.ambiguous { background: var(--warn-soft); color: var(--warn); }
.more { display: flex; justify-content: center; padding: var(--s4); }
.empty { padding: var(--s6) var(--s4); text-align: center; color: var(--muted); }
.empty h2 { color: var(--text); font-size: 17px; margin: 0 0 var(--s1); }
.empty .actions { display: flex; gap: var(--s2); justify-content: center; margin-top: var(--s4); flex-wrap: wrap; }

.crumbs { display: flex; gap: var(--s2); align-items: center; font-size: 14px; margin-bottom: var(--s2); min-height: 28px; }
.detail h1 { font-size: 24px; margin: 0 0 2px; letter-spacing: -.01em; line-height: 1.25; text-wrap: balance; outline: none; }
.headrow { display: flex; gap: var(--s3) var(--s4); justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.actions { display: flex; gap: var(--s2); flex-wrap: wrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s3); margin-top: var(--s4); }
.tile { padding: var(--s3) var(--s4); min-width: 0; }
.tile-l { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.tile-v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.3; margin-top: 2px; overflow-wrap: anywhere; }
.tile-v.small { font-size: 15px; font-weight: 600; }
.tile-s { font-size: 12.5px; }
.jump { display: flex; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s4); }
.grid { display: grid; grid-template-columns: 2fr 1fr; gap: var(--s4); margin-top: var(--s4); }
.grid > * { min-width: 0; }
.pad { padding: var(--s4); }
.summary p { margin: 0 0 var(--s2); max-width: 75ch; }
a.cite { display: inline-block; font-size: 11px; line-height: 1; padding: 3px 5px; margin: 0 1px; border-radius: 4px; background: var(--accent-soft); vertical-align: 2px; font-variant-numeric: tabular-nums; }
h2 { font-size: 15px; margin: 0 0 var(--s3); }
.section { margin-top: var(--s4); scroll-margin-top: 120px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.fam { display: flex; gap: 6px; flex-wrap: wrap; }
.claims td, .claims th { font-size: 14px; }
.claims th.field { color: var(--muted); font-weight: 400; width: 22%; }
.claims th.field::first-letter { text-transform: uppercase; }
.claims td.perma { width: 36px; text-align: right; }
.claims td.perma a { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: var(--radius-s); color: var(--muted); }
.claims td.perma a:hover { background: var(--raised); color: var(--accent); text-decoration: none; }
.claims.collapsed tr.extra { display: none; }
.claim-row { scroll-margin-top: 140px; }
.claim-row.flash { background: var(--warn-soft); box-shadow: inset 3px 0 0 var(--warn); }
.ev { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.ev > span + span::before { content: " · "; }
.ev code, code { font-family: var(--mono); font-size: 12px; }
.acct { overflow-x: auto; }
.acct td, .acct th { white-space: nowrap; }
.acct tbody th { font-weight: 400; color: var(--muted); font-size: 14px; }
details.more-ev > summary { cursor: pointer; padding: var(--s3) var(--s4); color: var(--accent); font-size: 14px; min-height: var(--tap); display: flex; align-items: center; }
.change { padding: var(--s2) 0; border-bottom: 1px solid var(--line); font-size: 14px; } .change:last-child { border: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px var(--s3); font-size: 14px; align-items: start; } .kv dt { color: var(--muted); } .kv dd { margin: 0; }
.stale { opacity: .7; }
.cmp-wrap { overflow-x: auto; }
table.cmp th, table.cmp td { min-width: 150px; }
table.cmp tbody th { position: sticky; left: 0; background: var(--surface); min-width: 120px; width: 150px; font-weight: 400; color: var(--muted); font-size: 13px; z-index: 1; }
table.cmp thead th { text-transform: none; letter-spacing: 0; font-size: 14px; white-space: normal; vertical-align: bottom; }
table.cmp thead th:first-child { position: sticky; left: 0; z-index: 2; }
table.cmp tr.group th { background: var(--raised); color: var(--text); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; position: static; }
table.cmp .top { font-weight: 700; }
.colhead { display: flex; gap: var(--s2); justify-content: space-between; align-items: flex-start; }
.x { all: unset; cursor: pointer; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-s); color: var(--muted); flex: none; }
.x:hover { background: var(--raised); color: var(--bad); } .x:focus-visible { outline: 2px solid var(--accent); }

.compare-bar { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); border-radius: 14px; padding: 8px 8px 8px 16px; display: none; gap: var(--s2); align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: var(--z-bar); max-width: calc(100vw - 24px); }
.compare-bar span { font-size: 14px; white-space: nowrap; }
.compare-bar .btn { border-color: transparent; background: transparent; color: inherit; }
.compare-bar .btn:hover { background: rgba(127,127,127,.25); }
.compare-bar .btn.primary { background: var(--accent); color: var(--on-accent); }

@media (max-width: 1040px) { .chips { flex-basis: 100%; } table.list .hide-t { display: none; } .dots { gap: 2px; } .dot { width: 8px; height: 8px; } .cov { gap: 6px; } }
@media (max-width: 768px) {
  body { font-size: 16px; }
  .bar { flex-wrap: wrap; gap: var(--s2); }
  .brand { flex: 1 1 auto; }
  .search { order: 3; flex-basis: 100%; }
  .grid { grid-template-columns: 1fr; }
  .tools { flex: 1 1 100%; } .sort { flex: 1 1 auto; } .sort select { flex: 1 1 auto; min-width: 0; }
  .legend { display: none; }
  table.list thead { display: none; }
  table.list, table.list tbody { display: block; }
  table.list tr { display: grid; grid-template-columns: var(--tap) 1fr 1fr; gap: 4px 10px; padding: 12px; border-bottom: 1px solid var(--line); align-items: start; }
  table.list td { border: 0; padding: 0; min-width: 0; }
  table.list td.pk { grid-row: 1 / 4; }
  table.list td.nm, table.list td.dt { grid-column: 2 / 4; }
  table.list td[data-l="Revenue"] { grid-column: 2; }
  table.list td[data-l="Result"] { grid-column: 3; }
  table.list td.num::before { content: attr(data-l) " "; color: var(--muted); font-size: 12.5px; }
  table.list td.hide-m { display: none; }
  table.list td.num { text-align: left; }
  .pick { margin: -6px 0 0 -10px; }
  .claims tr { display: grid; grid-template-columns: 1fr 36px; border-bottom: 1px solid var(--line); }
  .claims th.field { grid-column: 1 / 3; width: auto; padding-bottom: 0; border: 0; }
  .claims td { border: 0; min-width: 0; }
  .detail h1 { font-size: 21px; }
  table.cmp th, table.cmp td { min-width: 130px; }
  table.cmp tbody th { min-width: 96px; width: 96px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
@media print { header, .compare-bar, .toolbar, .jump, .actions, .perma { display: none !important; } .card { box-shadow: none; } .claims.collapsed tr.extra { display: table-row; } }
</style>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<header>
  <div class="bar">
    <a class="brand" href="#/" aria-label="Signalpost explorer, all companies">Signalpost <span>explorer</span></a>
    <div class="search" role="search">
      <label class="sr-only" for="q">Search companies</label>
      <input id="q" type="search" placeholder="Search name, org number, place, industry, leader…" autocomplete="off" spellcheck="false" aria-keyshortcuts="/">
    </div>
    <button class="btn icon" id="theme" aria-label="Switch between light and dark theme"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  </div>
</header>
<main id="app" tabindex="-1"><div class="empty">Loading…</div></main>
<div class="sr-only" id="live" role="status" aria-atomic="true"></div>
<div class="compare-bar" id="cbar" role="region" aria-label="Compare selection"><span id="ctext"></span><button class="btn" id="cclear">Clear</button><button class="btn primary" id="cgo">Compare</button></div>
<script>
const FAMILIES = {legal_identity:"Legal identity", public_brand:"Public brand", group_relationships:"Group", annual_accounts:"Accounts", filing_history:"Filings", leadership:"Leadership", registered_workplaces:"Workplaces", official_website:"Website", company_profiles:"Profiles", jobs:"Jobs", dated_activity:"Activity"};
const SECTION_TITLES = {legal_identity:"Legal identity and public brand", annual_accounts:"Annual accounts and history", leadership_workplaces:"Leadership and registered workplaces", web_presence:"Official website and company-owned profiles", hiring_activity:"Hiring and dated public activity"};
const SECTION_SHORT = {legal_identity:"Identity", annual_accounts:"Accounts", leadership_workplaces:"Leadership", web_presence:"Web presence", hiring_activity:"Hiring and activity"};
const STATE_LABEL = {available:"available", not_available:"not found", blocked:"blocked", not_applicable:"not applicable", ambiguous:"ambiguous", failed:"failed"};
const SOURCE_LABEL = {official_registry_live:"Brønnøysund register", official_annual_accounts:"Annual accounts register", official_roles:"Register of roles", official_subunits:"Register of sub-units", official_group_structure:"Group structure register", official_role_update_log:"Role update log", official_job_register_nav:"NAV job register", registry_linked_company_website:"Company website (listed in the register)", employer_declared_homepage:"Company website (declared in a NAV ad)", registry_email_domain:"Company website (register e-mail domain)", name_derived_domain:"Company website (name-derived domain)", frozen_universe_snapshot:"Builderr universe snapshot"};
const SCOPE_LABEL = {exact_entity_verified_by_organisation_number:"Verified: organisation number is on the site", norwegian_domain:"Verified by legal name; Norwegian domain", possibly_group_or_international:"Possibly a group or international site", page_on_third_party_site:"A page on a third-party site (chain, directory or platform)"};
const ACCOUNT_ROWS = [["revenue","Revenue"],["operating_result","Operating result"],["profit_before_tax","Profit before tax"],["annual_result","Net result"],["assets","Total assets"],["equity","Equity"],["debt","Debt"]];
const FILTERS = {w:["Verified website", r => r.w], j:["Hiring signal", r => (r.a||{}).jobs === "available"], x:["Company profiles", r => r.x], y:["News", r => r.y], r:["Reports revenue", r => r.r != null], c:["Changed", r => r.c]};
const SORTS = {cov:["Coverage (most first)", r => coverage(r), "desc"], name:["Name (A–Z)", r => (r.n||"").toLowerCase(), "asc"], rev:["Revenue (highest first)", r => r.r, "desc"], res:["Net result (highest first)", r => r.p, "desc"], emp:["Employees (most first)", r => r.e, "desc"]};
const PAGE = 100, MAX_COMPARE = 4;

let rows = [], cache = {}, selected = new Set();
let state = {q: "", f: new Set(), s: "cov", d: "desc", shown: PAGE};
let lastKind = null, listScroll = 0;
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const human = v => String(v ?? "").replace(/_/g, " ");
const safeUrl = u => /^https?:\/\//i.test(String(u||"")) ? String(u) : null;
const link = (u, label) => safeUrl(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(label || u)}</a>` : esc(label || u || "");
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return String(u||""); } };
const say = text => { $("#live").textContent = text; };
function nok(v) {
  if (v == null) return "—";
  const a = Math.abs(v), sign = v < 0 ? "−" : "";
  if (a >= 1e9) return `${sign}${(a/1e9).toFixed(1)} bn`;
  if (a >= 1e6) return `${sign}${(a/1e6).toFixed(1)} m`;
  if (a >= 1e4) return `${sign}${Math.round(a/1e3)} k`;
  return sign + new Intl.NumberFormat("en-GB", {maximumFractionDigits: 0}).format(a);
}
const money = v => v == null ? "—" : `<span class="${v < 0 ? "neg" : ""}">${nok(v)}</span>`;
const coverage = r => Object.keys(FAMILIES).filter(k => (r.a||{})[k] === "available").length;
const badge = (st, label) => `<span class="badge ${esc(st)}">${esc(label ? label + ": " : "")}${esc(STATE_LABEL[st] || human(st))}</span>`;

  if (state.s !== "cov" || state.d !== "desc") { p.set("s", state.s); p.set("d", state.d); }

}

function exportCsv(list) {

  const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const text = [cols.map(c => c[0]).join(","), ...list.map(r => cols.map(c => cell(c[1](r))).join(","))].join("\r\n");

function fmtValue(c) {
  const v = c.value;
  if (c.field === "website_scope") return esc(SCOPE_LABEL[v] || human(v));
  if (c.field === "share_capital" && typeof v === "number") return `NOK ${new Intl.NumberFormat("en-GB").format(v)}`;
  if (v && typeof v === "object" && !Array.isArray(v)) {
    if ("amount" in v) return `${esc(v.currency||"NOK")} ${money(v.amount)} <span class="sub">${esc(new Intl.NumberFormat("en-GB").format(v.amount))}</span>`;
    if (c.field === "open_job") return `${link(v.public_url, v.title)}<div class="sub">${esc([v.published && "published " + v.published.slice(0,10), v.expires && "expires " + v.expires.slice(0,10), (v.work_locations||[]).map(l => l.city || l.municipal).filter(Boolean).join(", ")].filter(Boolean).join(" · "))}</div>`;
    if (c.field === "previous_legal_name") return `${esc(v.name)} <span class="sub">${esc([v.from, v.to].filter(Boolean).join(" to "))}</span>`;
    if (c.field === "registry_declared_site") return `${link(v.url)}<div class="sub">${esc(v.relation||"")}</div>`;
    if ("date" in v && "title" in v) return `${esc(v.date || v.year || "")} — ${v.url ? link(v.url, v.title) : esc(v.title)}`;
    if ("role" in v) return `${esc(v.name)} <span class="sub">${esc(v.role)}${v.organisation_number ? " · " + esc(v.organisation_number) : ""}</span>`;
    if (c.family === "registered_workplaces") return `${esc(v.name)} <span class="sub">${esc(v.address||"")}${v.registered_employees ? " · " + esc(v.registered_employees) + " employees" : ""}</span>`;
    if (c.family === "group_relationships") return `${esc(v.relation)}: ${/^\d{9}$/.test(v.organisation_number||"") && rows.some(r => r.o === v.organisation_number) ? `<a href="#/c/${esc(v.organisation_number)}">${esc(v.name)}</a>` : esc(v.name)} <span class="sub">${esc(v.organisation_number)} · ${esc(v.ownership_basis||"")}</span>`;
    if ("beskrivelse" in v) return `${esc(v.beskrivelse)} <span class="sub">${esc(v.kode)}</span>`;
    return `<code>${esc(JSON.stringify(v))}</code>`;
  }

}

    return `<div class="ev"><span>Source: ${link(url, SOURCE_LABEL[e.source_class] || human(e.source_class || "source"))}${safeUrl(url) ? ` <span class="sub">(${esc(host(url))})</span>` : ""}</span><span>retrieved ${esc((e.retrieved_at||"").slice(0,16).replace("T"," "))} UTC</span>${e.content_sha256 ? `<span title="SHA-256 of the fetched content: ${esc(e.content_sha256)}">sha256 <code>${esc(e.content_sha256.slice(0,10))}</code></span>` : ""}${c.locator ? `<span>at <code>${esc(c.locator)}</code></span>` : ""}${e.from_previous_run ? "<span>from previous run</span>" : ""}</div>`; }).join("");

  const app = $("#app");
  $("#addcmp").onclick = e => { const on = !selected.has(org); if (!toggleCompare(org, on)) return; e.currentTarget.setAttribute("aria-pressed", String(on)); e.currentTarget.textContent = on ? "Added to compare" : "Add to compare"; say(on ? "Added to compare" : "Removed from compare"); };
  $$("[data-jump]", app).forEach(b => b.onclick = () => { const el = document.getElementById(b.dataset.jump); if (el) { el.scrollIntoView({block: "start"}); $("h2", el)?.setAttribute("tabindex", "-1"); $("h2", el)?.focus({preventScroll: true}); } });
  $$("[data-expand]", app).forEach(b => b.onclick = () => { b.closest(".section").querySelector("table.claims").classList.remove("collapsed"); b.parentElement.remove(); });
  updateBar();
}
function revealClaim(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const d = el.closest("details"); if (d) d.open = true;
  const t = el.closest("table.collapsed"); if (t) { t.classList.remove("collapsed"); t.parentElement.querySelector("[data-expand]")?.parentElement.remove(); }
  $$(".claim-row.flash").forEach(r => r.classList.remove("flash"));
  el.classList.add("flash");
  el.scrollIntoView({block: "center"});
}

// ---------- compare page
async function renderCompare(orgs) {
  const envs = await Promise.all(orgs.map(company));
  const pick = (env, family, field) => (env.claims||[]).filter(c => c.family === family && c.field === field && !c.stale);
  const latest = (env, field) => pick(env, "annual_accounts", field).sort((a, b) => (b.reporting_period||"").localeCompare(a.reporting_period||""))[0];
  const src = (env, c, html) => c ? `<a class="src" href="#/c/${esc(env.organisation_number)}/${esc(c.claim_id)}" title="Show evidence">${html}</a>` : html;
  const text = (family, field, fn = c => esc(c.value)) => env => { const c = pick(env, family, field)[0]; return {html: c ? src(env, c, fn(c)) : "—"}; };
  const amount = field => env => { const c = latest(env, field); return {html: c ? src(env, c, money(c.value.amount)) : "—", n: c ? c.value.amount : null}; };
  const role = code => env => { const c = pick(env, "leadership", "role").find(c => c.value.role_code === code); return {html: c ? src(env, c, esc(c.value.name)) : "—"}; };
  const groups = [
    ["Identity", [["Org. no.", env => ({html: esc(env.organisation_number)})], ["Legal form", text("legal_identity", "legal_form")], ["Municipality", text("legal_identity", "municipality")],
      ["Industry", text("legal_identity", "industry", c => esc(c.value?.beskrivelse || "—"))], ["Founded", text("legal_identity", "founded_date")]]],
    ["Latest filed accounts (NOK)", [["Financial year", env => { const c = latest(env, "revenue") || latest(env, "annual_result"); return {html: c ? `<span title="${esc(c.reporting_period.replace("..", " to "))}">${esc(c.reporting_period.slice(-10, -6))}</span>` : "—"}; }],
      ["Revenue", amount("revenue"), true], ["Operating result", amount("operating_result"), true], ["Net result", amount("annual_result"), true], ["Equity", amount("equity"), true]]],
    ["People", [["Registered employees", env => { const c = pick(env, "legal_identity", "registered_employees")[0]; return {html: c ? src(env, c, esc(c.value)) : "—", n: c ? Number(c.value) : null}; }, true],
      ["CEO", role("DAGL")], ["Chair", role("LEDE")], ["Workplaces", env => ({html: pick(env, "registered_workplaces", "registered_workplace").length || "—"})]]],
    ["Presence and activity", [["Website", env => { const c = pick(env, "official_website", "official_website")[0]; return {html: c ? `${link(c.value, host(c.value))} <span class="sub">${src(env, c, "evidence")}</span>` : badge(env.availability?.official_website || "not_available")}; }],
      ["Profiles", env => { const cs = (env.claims||[]).filter(c => c.family === "company_profiles" && !c.stale); return {html: cs.length ? cs.map(c => link(c.value, c.field)).join(", ") : badge(env.availability?.company_profiles || "not_available")}; }],
      ["Open jobs", env => { const n = pick(env, "jobs", "open_job").length, cp = pick(env, "jobs", "careers_page")[0]; return {html: n || (cp ? link(cp.value, "careers page") : badge(env.availability?.jobs || "not_available"))}; }],
      ["Changes since last run", env => ({html: (env.changes||[]).length})]]],
  ];
  $("#app").innerHTML = `<nav class="crumbs" aria-label="Breadcrumb"><a href="${listHash()}">← All companies</a></nav>
    <h1 class="sr-only">Compare ${envs.length} companies</h1>
    <p class="meta"><span>Comparing ${envs.length} companies. Values link to their evidence; the highest figure in a row is bold.</span></p>
    <div class="card cmp-wrap"><table class="cmp"><thead><tr><th scope="col"><span class="sr-only">Field</span></th>${envs.map(e => `<th scope="col"><div class="colhead"><a href="#/c/${esc(e.organisation_number)}">${esc(e.legal_name)}</a>${envs.length > 2 ? `<button class="x" data-remove="${esc(e.organisation_number)}" aria-label="Remove ${esc(e.legal_name)} from comparison">✕</button>` : ""}</div></th>`).join("")}</tr></thead>
    <tbody>${groups.map(([title, lines]) => `<tr class="group"><th colspan="${envs.length + 1}" scope="colgroup">${title}</th></tr>` + lines.map(([label, fn, numeric]) => { const cells = envs.map(fn); const max = numeric ? Math.max(...cells.map(c => c.n ?? -Infinity)) : null;
      return `<tr><th scope="row">${label}</th>${cells.map(c => { const top = numeric && envs.length > 1 && c.n != null && c.n === max && cells.filter(x => x.n === max).length === 1; return `<td class="${top ? "top" : ""}">${c.html}${top ? '<span class="sr-only"> (highest)</span>' : ""}</td>`; }).join("")}</tr>`; }).join("")).join("")}</tbody></table></div>`;
  $$("[data-remove]").forEach(b => b.onclick = () => { selected.delete(b.dataset.remove); location.hash = `#/compare/${orgs.filter(o => o !== b.dataset.remove).join(",")}`; });
  updateBar();
}

// ---------- routing
async function route() {
  const h = location.hash.slice(1), prev = lastKind;
  if (prev === "list") listScroll = scrollY;  // the list is still on screen here, so this is where the reader left it
  let m, kind = "list";
  try {
    if ((m = h.match(/^\/c\/(\d{9})(?:\/(cl-[0-9a-f]+))?/))) {
      kind = lastKind = "company:" + m[1];
      if (prev !== kind) await renderCompany(m[1]);
      if (m[2]) revealClaim(m[2]); else if (prev !== kind) scrollTo(0, 0);
    } else if ((m = h.match(/^\/compare\/([\d,]+)/))) {
      kind = lastKind = "compare";
      const orgs = [...new Set(m[1].split(",").filter(o => /^\d{9}$/.test(o)))].slice(0, MAX_COMPARE);
      selected = new Set(orgs);
      await renderCompare(orgs); scrollTo(0, 0);
    } else {
      readListHash(h);
      lastKind = kind;
      renderList();
      scrollTo(0, prev && prev !== "list" ? listScroll : 0);
    }
  } catch (err) {
    $("#app").innerHTML = `<div class="card empty"><h2>This page could not be loaded</h2><p>${esc(err.message)}</p><div class="actions"><a class="btn" href="#/">Back to all companies</a></div></div>`;
  }
  const changed = prev !== kind || kind === "compare";
  lastKind = kind;
  updateBar();
  if (changed && document.activeElement !== $("#q") && !/\/cl-/.test(h)) ($("#app h1[tabindex]") || $("#app")).focus({preventScroll: true});
}
let typing;
$("#q").oninput = e => {
  state.q = e.target.value;
  clearTimeout(typing);
  typing = setTimeout(() => { if (lastKind === "list") listChanged(); else location.hash = listHash(); }, 120);
};
addEventListener("keydown", e => { if (e.key === "/" && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName) && !e.ctrlKey && !e.metaKey) { e.preventDefault(); $("#q").focus(); } });
addEventListener("hashchange", route);
load();
</script>
