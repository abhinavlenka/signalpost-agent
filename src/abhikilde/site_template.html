<style>

}

  --bg: #0b1220; --surface: #111a2e; --raised: #18233b; --text: #e6eaf2; --muted: #a3b0c6; --line: #24304a; --line-strong: #34425f; --control: #5f7092;
  --accent: #93b4ff; --accent-soft: #1b2a4d; --on-accent: #0b1220;

}

* { box-sizing: border-box; }

.skip:focus { top: var(--s2); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); padding: 0 12px; border: 1px solid var(--control); background: var(--surface); border-radius: 8px; font-size: 14px; white-space: nowrap; transition: background-color .15s, border-color .15s; }
.btn:hover { background: var(--raised); text-decoration: none; } .btn:active { background: var(--accent-soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }

main { max-width: 1200px; margin: 0 auto; padding: var(--s4); }
main:focus, main:focus-visible, h1:focus, h1:focus-visible, h2[tabindex]:focus-visible { outline: none; }

a.src:hover { color: var(--accent); text-decoration: underline solid; }

.toolbar { display: flex; gap: var(--s2) var(--s3); align-items: center; flex-wrap: wrap; margin-bottom: var(--s3); }
.chips { display: flex; gap: var(--s2); flex-wrap: wrap; flex: 1 1 0; min-width: 260px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: var(--tap); border: 1px solid var(--control); background: var(--surface); border-radius: 999px; padding: 0 12px; font-size: 13px; white-space: nowrap; transition: background-color .15s, border-color .15s; }
.chip:hover { background: var(--raised); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
.tools { display: flex; gap: var(--s2) var(--s3); align-items: center; }
.sort { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
select { min-height: var(--tap); padding: 0 8px; border: 1px solid var(--control); border-radius: 8px; background: var(--surface); font-size: 14px; }
details.adv { flex: 1 1 100%; }
details.adv > summary { cursor: pointer; display: inline-flex; align-items: center; min-height: var(--tap); font-size: 13px; color: var(--accent); }
.advgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--s3); padding: var(--s3) 0 var(--s1); max-width: 860px; }
.advgrid label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.advgrid input, .advgrid select { min-height: var(--tap); padding: 0 10px; border: 1px solid var(--control); border-radius: 8px; background: var(--surface); font-size: 16px; width: 100%; }
.fp { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0; margin-top: var(--s4); }
.fp > div { padding: var(--s3) var(--s4); border-right: 1px solid var(--line); min-width: 0; }
.fp > div:last-child { border-right: 0; }
.fp h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; margin: 0 0 4px; }
.fp p { margin: 0 0 2px; font-size: 14px; }
details.menu { position: relative; }

details.menu .pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 10; display: grid; gap: 4px; padding: var(--s2); min-width: 220px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,.18); }

.sec { font-weight: 650; }
.meta { color: var(--muted); font-size: 13px; margin: 0 0 var(--s3); display: flex; justify-content: space-between; gap: var(--s2) var(--s4); flex-wrap: wrap; align-items: center; }
.legend { display: inline-flex; gap: var(--s3); flex-wrap: wrap; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow-wrap: break-word; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }

th button.sortbtn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; min-height: 24px; }
th button.sortbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
th button.sortbtn:disabled { cursor: default; }

table.list tbody tr { cursor: pointer; transition: background-color .15s; } table.list tbody tr:hover { background: var(--raised); }

.neg { color: var(--bad); }
.name { font-weight: 600; color: var(--text); } a.name:hover { color: var(--accent); }

.dots { display: inline-flex; gap: 3px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: transparent; border: 1.5px solid var(--control); flex: none; }
.dot.available { background: var(--ok); border-color: var(--ok); }
.dot.ambiguous { background: var(--warn); border-color: var(--warn); border-radius: 1px; transform: rotate(45deg) scale(.85); }
.dot.failed, .dot.blocked { background: var(--bad); border-color: var(--bad); border-radius: 1px; }
.dot.not_applicable { border-style: dotted; }
.badge { display: inline-block; font-size: 12px; line-height: 1.5; padding: 1px 8px; border-radius: 999px; background: var(--na-soft); color: var(--na); white-space: nowrap; }
.badge.available { background: var(--ok-soft); color: var(--ok); } .badge.failed, .badge.blocked { background: var(--bad-soft); color: var(--bad); }
.badge.ambiguous { background: var(--warn-soft); color: var(--warn); }
.more { display: flex; justify-content: center; padding: var(--s4); }
.empty { padding: var(--s6) var(--s4); text-align: center; color: var(--muted); }
.empty h2 { color: var(--text); font-size: 17px; margin: 0 0 var(--s1); }
.empty .actions { display: flex; gap: var(--s2); justify-content: center; margin-top: var(--s4); flex-wrap: wrap; }

.crumbs { display: flex; gap: var(--s2); align-items: center; font-size: 14px; margin-bottom: var(--s2); min-height: 28px; }
.detail h1 { font-size: 24px; margin: 0 0 2px; letter-spacing: -.01em; line-height: 1.25; text-wrap: balance; outline: none; }
.headrow { display: flex; gap: var(--s3) var(--s4); justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.actions { display: flex; gap: var(--s2); flex-wrap: wrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s3); margin-top: var(--s4); }
.tile { padding: var(--s3) var(--s4); min-width: 0; }
.tile-l { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
.tile-v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.3; margin-top: 2px; overflow-wrap: anywhere; }
.tile-v.small { font-size: 15px; font-weight: 600; }
.tile-s { font-size: 12.5px; }
.jump { display: flex; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s4); }
.grid { display: grid; grid-template-columns: 2fr 1fr; gap: var(--s4); margin-top: var(--s4); }
.grid > * { min-width: 0; }
.pad { padding: var(--s4); }
.summary p { margin: 0 0 var(--s2); max-width: 75ch; }
a.cite { display: inline-block; font-size: 11px; line-height: 1; padding: 3px 5px; margin: 0 1px; border-radius: 4px; background: var(--accent-soft); vertical-align: 2px; font-variant-numeric: tabular-nums; }
h2 { font-size: 15px; margin: 0 0 var(--s3); }
.section { margin-top: var(--s4); scroll-margin-top: 120px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.fam { display: flex; gap: 6px; flex-wrap: wrap; }
.claims td, .claims th { font-size: 14px; }
.claims th.field { color: var(--muted); font-weight: 400; width: 22%; }
.claims th.field::first-letter { text-transform: uppercase; }
.claims td.perma { width: 36px; text-align: right; }
.claims td.perma a { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: var(--radius-s); color: var(--muted); }
.claims td.perma a:hover { background: var(--raised); color: var(--accent); text-decoration: none; }
.claims.collapsed tr.extra { display: none; }
.claim-row { scroll-margin-top: 140px; }
.claim-row.flash { background: var(--warn-soft); box-shadow: inset 0 0 0 1px var(--warn); }
.ev { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

.acct { overflow-x: auto; }

.change { padding: var(--s2) 0; border-bottom: 1px solid var(--line); font-size: 14px; } .change:last-child { border: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px var(--s3); font-size: 14px; align-items: start; } .kv dt { color: var(--muted); } .kv dd { margin: 0; }
.stale { opacity: .7; }
.cmp-wrap { overflow-x: auto; }
table.cmp th, table.cmp td { min-width: 150px; }
table.cmp tbody th { position: sticky; left: 0; background: var(--surface); min-width: 120px; width: 150px; font-weight: 400; color: var(--muted); font-size: 13px; z-index: 1; }
table.cmp thead th { text-transform: none; letter-spacing: 0; font-size: 14px; white-space: normal; vertical-align: bottom; }
table.cmp thead th:first-child { position: sticky; left: 0; z-index: 2; }
table.cmp tr.group th { background: var(--raised); color: var(--text); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; position: static; }
table.cmp .top { font-weight: 700; }
.colhead { display: flex; gap: var(--s2); justify-content: space-between; align-items: flex-start; }
.x { all: unset; cursor: pointer; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--radius-s); color: var(--muted); flex: none; }
.x:hover { background: var(--raised); color: var(--bad); } .x:focus-visible { outline: 2px solid var(--accent); }

.compare-bar { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); border-radius: 14px; padding: 8px 8px 8px 16px; display: none; gap: var(--s2); align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: var(--z-bar); max-width: calc(100vw - 24px); }
.compare-bar span { font-size: 14px; white-space: nowrap; }
.compare-bar .btn { border-color: transparent; background: transparent; color: inherit; }
.compare-bar .btn:hover { background: rgba(127,127,127,.25); }
.compare-bar .btn.primary { background: var(--accent); color: var(--on-accent); }

/* plain-English search: example asks, how a query was read, and refusals */
.nl { display: grid; gap: var(--s2); margin-bottom: var(--s3); }
.lead { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; white-space: nowrap; }
.examples, .readas { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); }
.exlist, .qchips { display: flex; flex-wrap: wrap; gap: var(--s2); margin: 0; padding: 0; list-style: none; min-width: 0; }
.btn.ex, .btn.sugg { min-height: 32px; padding: 0 12px; border-radius: 999px; border-style: dashed; color: var(--muted); font-size: 13px; white-space: normal; text-align: left; }
.btn.ex:hover, .btn.sugg:hover { color: var(--text); border-style: solid; }
.qchip { display: inline-flex; align-items: center; gap: 2px; min-height: 32px; max-width: 100%; padding: 0 3px 0 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; }
.qchip > span { overflow-wrap: anywhere; }
.qchip.text { background: var(--raised); color: var(--text); font-weight: 500; }
.qx { all: unset; box-sizing: border-box; cursor: pointer; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; color: inherit; flex: none; transition: background-color .15s; }
.qx:hover, .qx:active { background: rgba(127,127,127,.22); }
.qx:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.meta:focus { outline: none; }
.refuse { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s3); padding: var(--s4); border-radius: var(--radius); background: var(--warn-soft); color: var(--text); }
.refuse-i { display: inline-flex; color: var(--warn); padding-top: 1px; }
.refuse-t { margin: 0 0 var(--s1); font-weight: 650; }
.refuse ul { margin: 0 0 var(--s3); padding-left: 18px; font-size: 14px; display: grid; gap: 4px; max-width: 75ch; }
/* "Ask about this company": answers assembled from the page's own cited facts */
.ask { margin-top: var(--s4); padding: var(--s4); }
.ask-l { display: block; font-weight: 650; margin-bottom: var(--s2); }
.ask-row { display: flex; gap: var(--s2); }
.ask-row input { flex: 1 1 auto; min-width: 0; min-height: var(--tap); padding: 7px 12px; border: 1px solid var(--control); border-radius: 8px; background: var(--bg); font-size: 16px; }
.ask-help { margin: var(--s2) 0 0; }
.ask-help.err { color: var(--bad); }
.ask-sugg { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); }
.answer { margin-top: var(--s4); padding-top: var(--s4); border-top: 1px solid var(--line); scroll-margin-top: 120px; }
.answer:focus { outline: none; }
.ans-head { display: flex; align-items: flex-start; gap: var(--s2) var(--s3); }
.ans-head h2 { margin: 0; }
.ans-q { margin: 0; padding-top: 1px; color: var(--muted); font-size: 14px; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.ans-block { margin-top: var(--s4); }
.ans-block h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
.ans-block p { margin: 0 0 var(--s2); max-width: 75ch; }
.ans-facts, .ans-list { margin: 0 0 var(--s2); padding-left: 18px; display: grid; gap: 6px; font-size: 14px; max-width: 75ch; }
.ans-k { color: var(--muted); }
.ans-ev { font-size: 12.5px; }
.ans-none { margin: var(--s3) 0 0; }
.linkbtn { all: unset; cursor: pointer; color: var(--accent); font-size: 13px; min-height: 24px; display: inline-flex; align-items: center; }
.linkbtn:hover { text-decoration: underline; }
.linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.section-chg { scroll-margin-top: 120px; }
::selection { background: var(--accent-soft); color: var(--text); }
input { caret-color: var(--accent); }
::placeholder { color: var(--muted); opacity: 1; }
@media (pointer: coarse) { .btn.ex, .btn.sugg, .qchip { min-height: var(--tap); } .qx { width: var(--tap); height: var(--tap); } .linkbtn { min-height: var(--tap); } }

@media (max-width: 1040px) { .chips { flex-basis: 100%; } table.list .hide-t { display: none; } .dots { gap: 2px; } .dot { width: 8px; height: 8px; } .cov { gap: 6px; } }
@media (max-width: 768px) {
  body { font-size: 16px; }
  .fp > div { border-right: 0; border-bottom: 1px solid var(--line); } .fp > div:last-child { border-bottom: 0; }
  details.menu .pop { right: auto; left: 0; }
  .bar { flex-wrap: wrap; gap: var(--s2); }
  .brand { flex: 1 1 auto; }
  .search { order: 3; flex-basis: 100%; }
  .grid { grid-template-columns: 1fr; }
  .tools { flex: 1 1 100%; } .sort { flex: 1 1 auto; } .sort select { flex: 1 1 auto; min-width: 0; }
  .legend { display: none; }
  table.list thead { display: none; }
  table.list, table.list tbody { display: block; }
  table.list tr { display: grid; grid-template-columns: var(--tap) 1fr 1fr; gap: 4px 10px; padding: 12px; border-bottom: 1px solid var(--line); align-items: start; }

<script id="sp-nl">
// Plain-English search and questions about one company. Pure functions with no page access, so the tests run them outside the browser.
// Nothing here is generated: a search becomes filters over the list, and an answer is assembled from the profile's own cited facts.
(function (root) {
  "use strict";
  const FAMILIES = {legal_identity: "Legal identity", public_brand: "Public brand", group_relationships: "Group", annual_accounts: "Accounts", filing_history: "Filings", leadership: "Leadership", registered_workplaces: "Workplaces", official_website: "Website", company_profiles: "Profiles", jobs: "Jobs", dated_activity: "Activity"};
  const STOP = new Set(("show me find list give get all any the a an of and or plus with without that which who whose what are is be been having have has in i on at for to from by " +
    "companies company firms firm businesses business entities entity organisations organizations please their its it they them there").split(" "));
  const DESCRIBES = /\b(?:companies|company|firms|businesses|entities)\b/;
  const LETTER = /[a-z0-9æøåäöüé]/;

  // ---------- amounts, comparisons, labels
  const UNIT = "(thousand|tusen|k|millioner|millions|million|mill|mnok|mn|m|milliarder|milliard|billions|billion|bn|b|mrd)";
  const UNITS = [[/^(?:thousand|tusen|k)$/, 1e3], [/^(?:millioner|millions?|mill|mnok|mn|m)$/, 1e6], [/^(?:milliarder|milliard|billions?|bn|b|mrd)$/, 1e9]];
  const AMOUNT = `(?:nok\\s*|kr\\.?\\s*)?(\\d+(?:[.,]\\d+)?)\\s*${UNIT}?(?:\\s*(?:nok|kr))?(?![a-z0-9æøå])`;
  const CMP = "(more than|greater than|over|above|exceeding|at least|no less than|minimum of|fewer than|less than|under|below|at most|no more than|up to|maximum of)";
  const amountOf = (num, unit) => parseFloat(String(num).replace(",", ".")) * ((UNITS.find(([re]) => re.test(unit || "")) || [0, 1])[1]);
  const opOf = w => /^(?:more than|greater than|over|above|exceeding|>)$/.test(w) ? ">" : /^(?:at least|no less than|minimum of|>=)$/.test(w) ? ">=" : /^(?:fewer than|less than|under|below|<)$/.test(w) ? "<" : "<=";
  const compare = {">": (a, b) => a > b, ">=": (a, b) => a >= b, "<": (a, b) => a < b, "<=": (a, b) => a <= b};
  const COUNT_SAY = {">": "more than", ">=": "at least", "<": "fewer than", "<=": "at most"};
  const AMOUNT_SAY = {">": "over", ">=": "at least", "<": "under", "<=": "at most"};
  const nok = v => { const a = Math.abs(v), f = (x, s) => `${+x.toFixed(1)} ${s}`; return a >= 1e9 ? f(v / 1e9, "bn") : a >= 1e6 ? f(v / 1e6, "m") : a >= 1e3 ? f(v / 1e3, "k") : String(Math.round(v)); };
  const known = v => v !== null && v !== undefined && v !== "";
  const titleCase = s => String(s).split(/(\s+|-)/).map(w => /^[\s-]*$/.test(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join("");
  const escapeRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const THIS_YEAR = new Date().getFullYear();

  // ---------- search: phrases that become filters over the company list
  const PLATFORMS = {linkedin: "LinkedIn", facebook: "Facebook", instagram: "Instagram", youtube: "YouTube", twitter: "X (Twitter)", tiktok: "TikTok"};
  const SECTORS = [
    ["construction", "construction|building|builders|contractors|bygg|entreprenør(?:er)?", /bygg|oppføring av bygninger|anlegg|grunnarbeid|elektrisk installasjon|rørlegg|snekker|maling|tømrer/],
    ["real estate", "real estate|property|properties|eiendom", /eiendom|borettslag|boligsameie|sameie/],
    ["software", "software|tech|technology|programvare", /programvare|datateknologi|informasjonsteknologi|programmering|databehandling|nettsted/],
    ["consulting", "consulting|consultancy|consultants|konsulent", /konsulent|rådgiv/],
    ["retail", "retail|shops|stores|butikk", /detaljhandel|butikk/],
    ["wholesale", "wholesale|wholesalers|engros", /engroshandel|agentur/],
    ["restaurants", "restaurants?|caf(?:e|é)s?|catering|food service", /restaurant|servering|kafé|kafe|catering|kantine/],
    ["transport", "transport|transportation|logistics|trucking|haulage|taxi", /transport|godsbil|frakt|logistikk|budtjeneste|drosje|taxi/],
    ["health", "health|healthcare|medical|clinics?|doctors?|dentists?", /lege|helse|tannlege|fysioterap|medisin|psykolog|sykehus|klinikk/],
    ["fishing", "fishing|fisheries|aquaculture|seafood|fish farming", /fiske|havbruk|akvakultur|fisk|skalldyr|bløtdyr|krepsdyr/],
    ["agriculture", "agriculture|agricultural|farming|farms?|forestry", /jordbruk|husdyr|gårds|skogbruk|planteproduksjon|dyrking|korn/],
    ["holding", "holding|investment", /holding|investering|egeninvestering|forvaltning av/],
    ["legal", "legal|law firms?|lawyers", /juridisk|advokat/],
    ["accounting", "accounting|accountants|auditing|auditors", /regnskap|revisjon|bokføring/],
    ["engineering", "engineering|engineers|architects?|architecture", /ingeniør|teknisk konsulent|arkitekt/],
    ["beauty", "beauty|hairdressers?|hair salons?|salons?", /frisør|skjønnhet|hudpleie/],
    ["hotels", "hotels?|accommodation|hospitality", /hotell|overnatting|camping/],
    ["education", "education|schools?|training", /undervisning|opplæring|skole|kurs/],
    ["marketing", "marketing|advertising|agencies", /reklame|markedsføring|kommunikasjon/],
    ["media", "media|publishing|publishers|film", /forlag|utgivelse|film|video|radio|fjernsyn/],
    ["manufacturing", "manufacturing|manufacturers|factories|industrial", /produksjon av|industri/],
    ["automotive", "automotive|car dealers?|cars|garages?", /motorvogn|bilverksted|bil/],
    ["energy", "energy|power|electricity|solar", /kraft|energi|elektrisitet|solcelle/],
    ["shipping", "shipping|maritime|ship ?owners", /sjøfart|skips|rederi|havn/],
    ["cleaning", "cleaning", /rengjøring|vaktmester/],
  ];
  const FORM_WORDS = [
    [/\b(?:public limited|publicly listed|listed|public)\s+(?:companies|company)\b|\ballmennaksjeselskap(?:er)?\b/g, ["ASA"]],
    [/\b(?:private limited|limited)\s+(?:companies|company)\b|\baksjeselskap(?:er)?\b/g, ["AS"]],
    [/\bsole (?:proprietorships?|traders?)\b|\benkeltpersonforetak\b/g, ["ENK"]],
    [/\bhousing co-?operatives?\b|\bborettslag\b/g, ["BRL"]],
    [/\bfoundations?\b|\bstiftelser?\b/g, ["STI"]],
    [/\bassociations?\b|\bforeninger?\b/g, ["FLI"]],
    [/\bforeign (?:branch(?:es)?|companies)\b/g, ["NUF"]],
    [/\bco-?operatives?\b|\bsamvirke(?:foretak)?\b/g, ["SA"]],
    [/\bpartnerships?\b/g, ["ANS", "DA"]],
  ];
  const TOP_KEYS = {rev: ["revenue", r => r.r], emp: ["employees", r => r.e], res: ["net result", r => r.p]};
  const topKey = w => /^(?:employees|staff|headcount)$/.test(w) ? "emp" : /^(?:net result|result|profit)$/.test(w) ? "res" : "rev";
  const counted = (op, n) => ({id: `emp${op}${n}`, label: `${COUNT_SAY[op]} ${n} employees`, test: r => known(r.e) && compare[op](+r.e, n)});
  const revenue = (op, v) => ({id: `rev${op}${v}`, label: `revenue ${AMOUNT_SAY[op]} NOK ${nok(v)}`, test: r => known(r.r) && compare[op](+r.r, v)});

  function rules(ctx) {
    const codes = [...new Set(["AS", "ASA", "ENK", "NUF", "ANS", "DA", "SA", "BRL", "STI", "FLI", "ESEK", ...(ctx.forms || [])].filter(Boolean).map(String))].sort((a, b) => b.length - a.length);
    const codeRe = codes.map(c => escapeRe(c.toLowerCase())).join("|");
    const list = [
      [new RegExp(`\\b(?:(?:with|and|having)\\s+)?${CMP}\\s+(\\d+)\\s+(?:registered\\s+)?(?:employees?|staff|people|workers|ansatte)\\b`, "g"), m => counted(opOf(m[1]), +m[2])],
      [/\b(?:(?:with|and|having)\s+)?(\d+)\s*\+\s*(?:registered\s+)?(?:employees?|staff|people|workers|ansatte)\b/g, m => counted(">=", +m[1])],
      [/\b(?:employees?|staff|headcount)\s*(>=|<=|>|<)\s*(\d+)/g, m => counted(m[1], +m[2])],
      [/\b(?:(?:with|and|having)\s+)?between\s+(\d+)\s+and\s+(\d+)\s+(?:employees?|staff|people)\b/g, m => ({id: `emp${m[1]}-${m[2]}`, label: `${m[1]}–${m[2]} employees`, test: r => known(r.e) && +r.e >= +m[1] && +r.e <= +m[2]})],
      [new RegExp(`\\b(?:(?:with|and|having)\\s+)?(?:an?\\s+)?(?:annual\\s+)?(?:revenue|turnover|sales|omsetning)\\s+(?:of\\s+)?${CMP}\\s+${AMOUNT}`, "g"), m => revenue(opOf(m[1]), amountOf(m[2], m[3]))],
      [new RegExp(`\\b(?:(?:with|and|having)\\s+)?${CMP}\\s+${AMOUNT}\\s+(?:in\\s+|of\\s+)?(?:annual\\s+)?(?:revenue|turnover|sales|omsetning)\\b`, "g"), m => revenue(opOf(m[1]), amountOf(m[2], m[3]))],
      [new RegExp(`\\b(?:revenue|turnover|sales|omsetning)\\s*(>=|<=|>|<)\\s*${AMOUNT}`, "g"), m => revenue(m[1], amountOf(m[2], m[3]))],
      [new RegExp(`\\b(?:(?:with|and|having)\\s+)?(?:an?\\s+)?(?:net\\s+)?(?:result|profit)\\s+(?:of\\s+)?${CMP}\\s+${AMOUNT}`, "g"), m => { const op = opOf(m[1]), v = amountOf(m[2], m[3]); return {id: `res${op}${v}`, label: `net result ${AMOUNT_SAY[op]} NOK ${nok(v)}`, test: r => known(r.p) && compare[op](+r.p, v)}; }],
      [/\b(?:(?:that are|which are|who are|are)\s+)?(?:profitable|in profit|making (?:a )?profits?|making money|(?:with|having) (?:a )?(?:positive (?:net )?result|profit)|overskudd)\b/g, () => ({id: "res>0", label: "profitable", test: r => known(r.p) && r.p > 0})],
      [/\b(?:(?:that are|which are|who are|are)\s+)?(?:loss[- ]making|unprofitable|making (?:a )?loss(?:es)?|losing money|in the red|(?:with|having) (?:a )?(?:net )?loss(?:es)?|(?:with|having) (?:a )?negative (?:net )?result|underskudd)\b/g, () => ({id: "res<0", label: "loss-making", test: r => known(r.p) && r.p < 0})],
      [/\b(?:(?:with|and)\s+)?(?:growing|increasing|rising)\s+(?:revenue|turnover|sales)\b|\b(?:revenue|turnover|sales)\s+(?:is\s+)?(?:growing|grew|up|increased|rising)\b|\b(?:growth|growing)\s+companies\b/g, () => ({id: "grow", label: "revenue up on the year before", test: r => known(r.r) && known(r.r0) && r.r > r.r0})],
      [/\b(?:(?:with|and)\s+)?(?:shrinking|declining|falling|decreasing)\s+(?:revenue|turnover|sales)\b|\b(?:revenue|turnover|sales)\s+(?:is\s+)?(?:shrinking|fell|down|decreased|declining|falling)\b/g, () => ({id: "shrink", label: "revenue down on the year before", test: r => known(r.r) && known(r.r0) && r.r < r.r0})],
      [/\b(?:without|with no|no|lacking|missing)\s+(?:an?\s+)?(?:verified\s+|official\s+|own\s+)?(?:websites?|web\s?sites?|homepages?|sites?)\b/g, () => ({id: "noweb", label: "no verified website found", test: r => !r.w})],
      [/\b(?:with|and|or|plus|has|have|having|that have|which have|owning)\s+(?:an?\s+)?(?:verified\s+|official\s+|own\s+)?(?:websites?|web\s?sites?|homepages?|sites?|domains?)\b/g, () => ({id: "web", label: "verified website", test: r => !!r.w})],
      [/\b(?:on|with|and|has|have|having)\s+(?:an?\s+)?(linkedin|facebook|instagram|youtube|twitter|tiktok)(?:\s+(?:pages?|profiles?|accounts?))?\b/g, m => ({id: `sp:${m[1]}`, label: `${PLATFORMS[m[1]]} profile`, test: r => (r.sp || []).includes(m[1])})],
      [/\b(?:on|with|and|has|have|having)\s+(?:company[- ]owned\s+)?social(?:\s+media)?(?:\s+(?:profiles?|accounts?|pages?))?\b/g, () => ({id: "prof", label: "company-owned profiles", test: r => r.x > 0})],
      [/\b(?:(?:companies|firms|businesses|that are|who are|which are|are|currently|and|or)\s+)hiring\b|\bhiring\s+(?:companies|firms|businesses|now)\b|\b(?:with|has|have|having|and)\s+(?:open\s+|active\s+)?(?:jobs?|job ads?|job openings?|vacanc(?:y|ies)|openings|positions)\b/g, () => ({id: "hire", label: "hiring signal", test: r => (r.a || {}).jobs === "available"})],
      [/\b(?:with|and|or|plus|has|have|having|publishing|posting)\s+(?:recent\s+|any\s+)?(?:news|announcements|press releases?|blog posts?)\b/g, () => ({id: "news", label: "news on its website", test: r => r.y > 0})],
      [/\b(?:(?:that|which)\s+)?(?:have\s+)?changed(?:\s+since\s+(?:the\s+)?(?:last|previous)\s+run)?\b|\bwith\s+changes\b/g, () => ({id: "chg", label: "changed since the last run", test: r => r.c > 0})],
      [/\b(?:founded|established|started|incorporated|stiftet)\s+(?:(after|since|before|in)\s+)?(\d{4})\b/g, m => { const y = +m[2], w = m[1] || "in";
        return w === "after" ? {id: `fy>${y}`, label: `founded after ${y}`, test: r => known(r.fy) && r.fy > y} : w === "since" ? {id: `fy>=${y}`, label: `founded in or after ${y}`, test: r => known(r.fy) && r.fy >= y}
          : w === "before" ? {id: `fy<${y}`, label: `founded before ${y}`, test: r => known(r.fy) && r.fy < y} : {id: `fy=${y}`, label: `founded in ${y}`, test: r => r.fy === y}; }],
      [/\b(?:older than|more than)\s+(\d+)\s+years?(?:\s+old)?\b/g, m => ({id: `age>${m[1]}`, label: `founded more than ${m[1]} years ago`, test: r => known(r.fy) && r.fy < THIS_YEAR - m[1]})],
      [/\b(?:younger than|less than|under)\s+(\d+)\s+years?(?:\s+old)?\b/g, m => ({id: `age<${m[1]}`, label: `founded in the last ${m[1]} years`, test: r => known(r.fy) && r.fy >= THIS_YEAR - m[1]})],
      [new RegExp(`\\b(?:legal form\\s+)?(${codeRe})\\s+(?:companies|company|firms|entities|businesses|organisations|organizations)\\b|\\blegal form\\s+(${codeRe})\\b`, "g"), m => { const f = (m[1] || m[2]).toUpperCase(); return {id: `f:${f}`, label: `legal form ${f}`, test: r => String(r.f || "").toUpperCase() === f}; }],
      ...FORM_WORDS.map(([re, forms]) => [re, () => ({id: `f:${forms.join("|")}`, label: `legal form ${forms.join(" or ")}`, test: r => forms.includes(String(r.f || "").toUpperCase())})]),
    ];
    return list;
  }
  const SECTOR_RULES = SECTORS.map(([key, words, test]) => [new RegExp(`\\b(?:${words})\\s+(?:companies|company|firms|businesses|sector|industry|entities)\\b|\\b(?:in|within)\\s+(?:the\\s+)?(?:${words})(?:\\s+(?:sector|industry|business))?\\b|\\bindustry[:\\s]+(?:${words})\\b`, "g"),
    () => ({id: `ind:${key}`, label: `industry: ${key}`, test: r => test.test(String(r.i || "").toLowerCase())})]);

  // What the agent does not collect. Matched before any filter, so "with good reviews" never turns into "with" plus leftover words.
  const UNSUPPORTED = [
    ["glassdoor", /\b(?:(?:with|having)\s+)?(?:(?:good|high|great|best|bad)\s+)?glassdoor(?:\s+(?:scores?|ratings?|reviews?))?\b/g, "Glassdoor and other employer reviews aren't collected; their terms don't allow it."],
    ["credit rating", /\b(?:(?:with|having)\s+)?(?:(?:good|high|low|bad)\s+)?(?:credit\s?(?:ratings?|scores?|worthiness)|creditworth(?:y|iness)|credit risk|kredittvurdering)\b/g, "Credit ratings aren't collected."],
    ["share price", /\b(?:share|stock) prices?\b|\bmarket (?:cap(?:italisation|italization)?|value)\b|\bvaluations?\b/g, "Share prices and market values aren't collected."],
    ["reviews", /\b(?:(?:with|having|that have)\s+)?(?:(?:good|great|bad|positive|negative|high|best|top|customer|google|online|user)\s+)*(?:reviews?|ratings?|rated|stars|trustpilot)\b/g, "Customer reviews and ratings aren't collected: no permitted review source is connected."],
    ["sentiment", /\b(?:(?:with|having)\s+)?(?:(?:positive|negative|good|bad|public|customer|media)\s+)*(?:sentiment|reputation|perception)\b/g, "Sentiment isn't scored: there is no labelled Norwegian evaluation set, and company-owned pages are promotional."],
    ["followers", /\b(?:(?:with|having)\s+)?(?:the\s+)?(?:(?:most|many|more|high|lots of|a lot of)\s+)?(?:social(?:\s+media)?\s+)?(?:followers|likes|engagement|buzz|subscribers)\b/g, "Social-media reach isn't measured; the agent only records links to company-owned profiles."],
    ["traffic", /\b(?:(?:with|having)\s+)?(?:(?:high|low|most|more|lots of|a lot of)\s+)?(?:(?:website|web|site|online)\s+)?(?:traffic|visitors|visits|page\s?views)\b/g, "Website traffic isn't measured by any source the agent uses."],
    ["salaries", /\b(?:salar(?:y|ies)|wages|pay levels?)\b/g, "Salaries aren't in the sources the agent uses."],
    ["competitors", /\b(?:competitors?|competition|rivals?|market share)\b/g, "Competitors and market share aren't covered."],
    ["customers", /\b(?:what\s+(?:do|does)\s+)?(?:customers?|clients?)(?:\s+(?:think|say|feel|like|rate))?\b/g, "Customer opinions and customer lists aren't in the sources the agent uses."],
    ["owners", /\b(?:who\s+(?:owns|owned)|owners?|owned by|shareholders?|aksjonær(?:er)?)\b/g, "Shareholder registers aren't among the sources; only group links registered in Brønnøysund are shown."],
    ["best", /\b(?:the\s+)?(?:best|worst|leading|most (?:reliable|trusted|reputable|respected)|recommended)\b/g, "There is no measure of “best” in the data. Try a figure instead, for example “top 10 by revenue”."],
  ];
  const MODIFIER = /\b(?:with|having|that have|good|great|bad|positive|negative|high|low|most|many|more|best|top|lots of|a lot of)\b/;

  const overlaps = (taken, s, e) => taken.some(([a, b]) => s < b && a < e);
  function scan(lq, re, taken, make, out) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(lq))) {
      const s = m.index, e = s + m[0].length;
      if (!m[0].length) { re.lastIndex++; continue; }
      if (overlaps(taken, s, e)) continue;
      const item = make(m);
      if (!item) continue;
      taken.push([s, e]);
      out.push(Object.assign(item, {span: [s, e]}));
    }
  }
  function tidy(s) {
    let t = String(s).replace(/\s+/g, " ").trim();
    const edge = /^(?:with|and|or|plus|that|which|who|having|have|has|are)\s+|\s+(?:with|and|or|plus|that|which|who|having|have|has|are)$/;
    while (edge.test(t)) t = t.replace(edge, "").trim();
    return t;
  }
  function cut(q, spans) {
    let out = String(q);
    [...spans].sort((a, b) => b[0] - a[0]).forEach(([s, e]) => { out = out.slice(0, s) + " " + out.slice(e); });
    return tidy(out);
  }

  function parseQuery(q, ctx) {
    ctx = ctx || {};
    const raw = String(q || ""), lq = raw.toLowerCase(), taken = [];
    const refused = [], filters = [];
    UNSUPPORTED.forEach(([term, re, reason]) => scan(lq, re, taken, () => ({term, reason}), refused));
    rules(ctx).forEach(([re, make]) => scan(lq, re, taken, make, filters));
    const tops = [];
    scan(lq, /\b(top|largest|biggest|smallest)\s+(\d+)\s+(?:companies\s+|firms\s+)?(?:by|in|on|for)\s+(revenue|turnover|sales|employees|staff|headcount|net result|result|profit)\b/g, taken,
      m => ({n: +m[2], key: topKey(m[3]), dir: m[1] === "smallest" ? "asc" : "desc"}), tops);

// Text scraped from websites must not run as a spreadsheet formula when the CSV is opened: prefix such cells with an apostrophe.

  let text = String(v ?? "");

function download(name, text, type) {

  a.href = URL.createObjectURL(new Blob([text], {type}));

function exportCsv(list) {

    <div><h3>Company profiles</h3>${profiles.length ? `<p>${profiles.map(c => link(c.value, (c.platform || c.field)[0].toUpperCase() + (c.platform || c.field).slice(1))).join(" · ")}</p>${ev(profiles[0])}` : `<p>${badge(env.availability?.company_profiles || "not_available")}</p>${reason("company_profiles")}`}</div>

    <div><h3>Latest dated activity</h3>${news.length ? `<p>${safeUrl(news[0].url) ? link(news[0].url, news[0].title) : esc(news[0].title)}</p><p class="sub">${esc(news[0].date)} · on the company site</p>${ev(news[0])}` : roleChange ? `<p>Roles updated in the register</p><p class="sub">${esc(roleChange.effective_date)}</p>${ev(roleChange)}` : `<p>${badge("not_available")}</p>`}</div>
  </section>`;
  $("#app").innerHTML = `<article class="detail">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="${listHash()}">← All companies</a></nav>
    <div class="headrow"><div><h1 tabindex="-1">${esc(env.legal_name || org)}</h1>
      <div class="sub">Org. no. ${esc(env.organisation_number)} · ${badge(env.state)} · run ${esc(env.run?.run_id)} · ${esc((env.run?.completed_at||"").slice(0,10))}</div></div>
      <div class="actions"><button class="btn" id="addcmp" aria-pressed="${inSel}">${inSel ? "Added to compare" : "Add to compare"}</button>
      <button class="btn" id="pin" aria-pressed="${pinned}">${pinned ? "Pinned" : "Pin"}</button>
      <details class="menu"><summary class="btn">Export</summary><div class="pop"><button class="btn" id="x-csv">Facts with evidence (CSV)</button><button class="btn" id="x-json">Full profile (JSON)</button></div></details>
      <a class="btn" href="https://virksomhet.brreg.no/nb/oppslag/enheter/${esc(org)}" target="_blank" rel="noopener noreferrer">Open in Brønnøysund register</a></div></div>
    <section class="card ask" aria-labelledby="ask-l">
      <form id="askf" novalidate>
        <label class="ask-l" id="ask-l" for="ask">Ask about this company</label>
        <div class="ask-row"><input id="ask" type="text" enterkeyhint="go" autocomplete="off" spellcheck="false" placeholder="Who runs it? Is it hiring?" aria-describedby="ask-help"><button class="btn primary" type="submit">Ask</button></div>
        <p class="sub ask-help" id="ask-help">Answers come only from the facts on this page, with links to their sources.</p>
      </form>
      <div class="ask-sugg" role="group" aria-label="Suggested questions">${SP_NL.SUGGESTIONS.map(x => `<button type="button" class="btn sugg" data-ask="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <div id="answer"></div>
    </section>
    <div class="tiles">
      ${tile("Revenue" + year(rev), rev ? "NOK " + money(rev.value.amount) : "—", rev)}
      ${tile("Net result" + year(res), res ? "NOK " + money(res.value.amount) : "—", res)}
      ${tile("Equity" + year(eq), eq ? "NOK " + money(eq.value.amount) : "—", eq)}
      ${tile("Employees", emp ? esc(emp.value) : "—", emp)}
      ${tile("Founded", founded ? esc(founded.value) : "—", founded, true)}
      ${tile(ceo && ceo.value.role_code === "LEDE" ? "Chair" : "CEO", ceo ? esc(ceo.value.name) : "—", ceo, true)}
    </div>
    ${footprint}
    <nav class="jump" aria-label="Sections on this page">${Object.keys(env.sections||{}).map(key => `<button class="chip" data-jump="sec-${esc(key)}">${esc(SECTION_SHORT[key] || key)} <span class="n">${(bySection[key]||[]).length}</span></button>`).join("")}</nav>
    <div class="grid">
      <section class="card pad summary" aria-labelledby="h-sum"><h2 id="h-sum">Summary</h2>${summary}${s.changes_text ? `<p><strong>${esc(s.changes_text)}</strong></p>` : ""}${s.unknowns_text ? `<p class="sub">${esc(s.unknowns_text)}</p>` : ""}<p class="sub">Numbers in the text link to the evidence for that sentence.</p></section>
      <section class="card pad section-chg" id="chg" aria-labelledby="h-chg"><h2 id="h-chg">Changes since previous run</h2>${changes.length ? changes.map(ch => `<div class="change"><span class="badge ${ch.material ? "ambiguous" : ""}">${esc(human(ch.change_type))}</span> ${esc(FAMILIES[ch.family]||ch.family)}<div class="sub">${esc(JSON.stringify(ch.previous_value ?? "—")).slice(0,120)} → ${esc(JSON.stringify(ch.current_value ?? "—")).slice(0,120)}</div></div>`).join("") : `<p class="sub">${env.refresh?.mode === "diff" ? `No changes since run ${esc(env.refresh.previous_run_id || "")}.` : "First observation; there is no previous run."}</p>`}
      ${log.length > changes.length ? `<p class="sub">${log.length} changes recorded across all runs.</p>` : ""}
      <h2 style="margin-top:16px">Field states</h2><dl class="kv">${states.map(([f, st]) => `<dt>${esc(FAMILIES[f]||human(f))}</dt><dd>${badge(st.state)}${st.reason && st.state !== "available" ? `<div class="sub">${esc(st.reason)}</div>` : ""}</dd>`).join("")}</dl></section>
    </div>
    ${Object.entries(env.sections||{}).map(([key, sec]) => { const list = bySection[key] || [], matrix = key === "annual_accounts" ? accountsMatrix(org, list) : "";
      const body = !list.length ? `<div class="pad sub">${Object.values(sec.fields||{}).map(st => esc(st.reason || STATE_LABEL[st.state] || st.state)).filter(Boolean).join(" · ")}</div>`
        : matrix ? `${matrix}<details class="more-ev"><summary>Evidence for all ${list.length} account facts</summary>${claimsTable(org, list, evidence, 1e9)}</details>` : claimsTable(org, list, evidence);
      return `<section class="card section" id="sec-${esc(key)}" aria-labelledby="h-${esc(key)}"><div class="section-head"><h2 style="margin:0" id="h-${esc(key)}">${esc(SECTION_TITLES[key]||sec.title)}</h2><div class="fam">${Object.entries(sec.fields||{}).map(([f, st]) => badge(st.state, FAMILIES[f]||human(f))).join("")}</div></div>${body}</section>`; }).join("")}
  </article>`;
  const app = $("#app");
  $("#addcmp").onclick = e => { const on = !selected.has(org); if (!toggleCompare(org, on)) return; e.currentTarget.setAttribute("aria-pressed", String(on)); e.currentTarget.textContent = on ? "Added to compare" : "Add to compare"; say(on ? "Added to compare" : "Removed from compare"); };
  $("#pin").onclick = e => { const on = !pins.has(org); on ? pins.add(org) : pins.delete(org); savePins(); e.currentTarget.setAttribute("aria-pressed", String(on)); e.currentTarget.textContent = on ? "Pinned" : "Pin"; say(on ? "Pinned. Find pinned companies with the Pinned filter in the list." : "Unpinned"); };
  $("#x-json").onclick = () => download(`abhikilde-${org}.json`, JSON.stringify(env, null, 2), "application/json");
  $("#x-csv").onclick = () => {
    const cols = ["claim_id", "section", "family", "field", "value", "reporting_period", "effective_date", "confidence", "span", "span_kind", "locator", "source_url", "source_class", "retrieved_at", "content_sha256", "snapshot_path", "rights"];
    const cell = csvCell;
    const lines = claims.map(c => { const e = evidence[(c.evidence_ids||[])[0]] || {}; return [c.claim_id, c.section, c.family, c.field, typeof c.value === "object" ? JSON.stringify(c.value) : c.value, c.reporting_period, c.effective_date, c.confidence, c.claim_span, c.span_kind, c.locator, e.final_url || e.source_url, e.source_class, e.retrieved_at, e.content_sha256, e.snapshot_path, e.rights].map(cell).join(","); });
    download(`abhikilde-${org}-evidence.csv`, "\ufeff" + [cols.join(","), ...lines].join("\r\n"), "text/csv;charset=utf-8");
  };
  const jump = b => b.onclick = () => { const el = document.getElementById(b.dataset.jump); if (el) { el.scrollIntoView({block: "start"}); $("h2", el)?.setAttribute("tabindex", "-1"); $("h2", el)?.focus({preventScroll: true}); } };
  $$("[data-jump]", app).forEach(jump);
  const askBox = $("#ask"), help = $("#ask-help"), helpText = help.textContent;
  const showAnswer = (q, focus) => {
    const a = SP_NL.answerQuestion(env, q);
    askBox.value = q; help.textContent = helpText; help.classList.remove("err");
    $("#answer").innerHTML = answerHtml(org, env, a);
    try { history.replaceState(null, "", `#/c/${org}?ask=${encodeURIComponent(q)}`); } catch (e) {}
    $$("[data-jump]", $("#answer")).forEach(jump);
    $("#ans-x").onclick = () => { $("#answer").innerHTML = ""; try { history.replaceState(null, "", `#/c/${org}`); } catch (e) {} askBox.focus(); say("Answer cleared"); };
    if (focus) { const box = $("#ans"), top = box.getBoundingClientRect().top; box.focus({preventScroll: true}); if (top < 80 || top > innerHeight - 160) box.scrollIntoView({block: "start"}); }
    say(answerSummary(a));
  };
  $("#askf").onsubmit = e => { e.preventDefault(); const q = askBox.value.trim(); if (!q) { help.textContent = "Type a question first, or pick one of the suggestions below."; help.classList.add("err"); askBox.focus(); return; } showAnswer(q, true); };
  $$("[data-ask]", app).forEach(b => b.onclick = () => showAnswer(b.dataset.ask, true));
  currentAsk = showAnswer;
  $$("[data-expand]", app).forEach(b => b.onclick = () => { b.closest(".section").querySelector("table.claims").classList.remove("collapsed"); b.parentElement.remove(); });
  updateBar();
}
// An answer is assembled from the profile's own cited sentences and facts; it says what is not known and what the data cannot answer.
function answerHtml(org, env, a) {
  const byId = Object.fromEntries((env.claims || []).map(c => [c.claim_id, c]));
  const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
  const cites = ids => ids.slice(0, 4).map((id, i) => `<a class="cite" href="#/c/${esc(org)}/${esc(id)}" aria-label="Evidence ${i + 1} for this sentence">${i + 1}</a>`).join("");
  const fact = id => { const c = byId[id]; return c ? `<li><span class="ans-k">${esc(cap(human(c.field)))}:</span> ${fmtValue(c)} <a class="ans-ev" href="#/c/${esc(org)}/${esc(id)}">evidence</a></li>` : ""; };
  const changed = t => t.changes.length ? `<ul class="ans-list">${t.changes.map(ch => `<li>${esc(cap(human(ch.change_type)))}: ${esc(FAMILIES[ch.family] || ch.family)}</li>`).join("")}</ul>`
    : `<p>No changes are recorded for this company.</p>`;
  const target = t => t.section ? [`sec-${t.section}`, SECTION_TITLES[t.section] || t.section] : t.id === "changes" ? ["chg", "Changes since previous run"] : null;
  const block = (title, body) => `<div class="ans-block"><h3>${esc(title)}</h3>${body}</div>`;
  return `<div class="answer" id="ans" tabindex="-1" aria-labelledby="ans-h">
    <div class="ans-head"><h2 id="ans-h">Answer</h2><p class="ans-q">“${esc(a.question)}”</p><button type="button" class="qx" id="ans-x" aria-label="Clear the answer">${ICON_X}</button></div>
    ${a.topics.map(t => { const go = target(t); return block(t.label, `${t.sentences.length ? `<p>${t.sentences.map(s => esc(s.text) + cites(s.claim_ids)).join(" ")}</p>` : ""}${t.notes.length ? `<p>${t.notes.map(esc).join(" ")}</p>` : ""}${t.changes ? changed(t) : ""}${t.facts.length ? `<ul class="ans-facts">${t.facts.map(fact).join("")}</ul>` : ""}${go ? `<button type="button" class="linkbtn" data-jump="${esc(go[0])}">Go to ${esc(go[1].toLowerCase())}</button>` : ""}`); }).join("")}
    ${a.matches.length ? block("Facts that mention your words", `<ul class="ans-facts">${a.matches.map(fact).join("")}</ul>`) : ""}
    ${a.unknown.length ? block("Not known", `<ul class="ans-list">${a.unknown.map(u => `<li><b>${esc(u.label)}:</b> ${esc(STATE_LABEL[u.state] || human(u.state))}${u.reason ? `. ${esc(cap(u.reason))}.` : "."}</li>`).join("")}</ul>`) : ""}
    ${a.unsupported.length ? block("Not answered from this data", `<ul class="ans-list">${a.unsupported.map(u => `<li><b>${esc(cap(u.term))}.</b> ${esc(u.reason)}</li>`).join("")}</ul>`) : ""}
    ${a.empty ? `<p class="ans-none">Nothing on this page matches that question. Try a suggestion above, or ask about leaders, finances, locations, the website or hiring.</p>` : ""}
  </div>`;
}
function answerSummary(a) {
  if (a.empty) return "No answer: nothing on this page matches that question.";
  const parts = [...a.topics.map(t => t.label), ...(a.matches.length ? ["facts that mention your words"] : [])];
  return `Answer shown${parts.length ? `: ${parts.join(", ")}` : ""}${a.unknown.length ? `; ${a.unknown.length} not known` : ""}${a.unsupported.length ? `; ${a.unsupported.length} not answered from this data` : ""}.`;
}
function revealClaim(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const d = el.closest("details"); if (d) d.open = true;
  const t = el.closest("table.collapsed"); if (t) { t.classList.remove("collapsed"); t.parentElement.querySelector("[data-expand]")?.parentElement.remove(); }
  $$(".claim-row.flash").forEach(r => r.classList.remove("flash"));
  el.classList.add("flash");
  el.scrollIntoView({block: "center"});
}

// ---------- compare page
async function renderCompare(orgs) {
  const envs = await Promise.all(orgs.map(company));
  const pick = (env, family, field) => (env.claims||[]).filter(c => c.family === family && c.field === field && !c.stale);
  const latest = (env, field) => pick(env, "annual_accounts", field).sort((a, b) => (b.reporting_period||"").localeCompare(a.reporting_period||""))[0];
  const src = (env, c, html) => c ? `<a class="src" href="#/c/${esc(env.organisation_number)}/${esc(c.claim_id)}" title="Show evidence">${html}</a>` : html;
  const text = (family, field, fn = c => esc(c.value)) => env => { const c = pick(env, family, field)[0]; return {html: c ? src(env, c, fn(c)) : "—"}; };
  const amount = field => env => { const c = latest(env, field); return {html: c ? src(env, c, money(c.value.amount)) : "—", n: c ? c.value.amount : null}; };
  const role = code => env => { const c = pick(env, "leadership", "role").find(c => c.value.role_code === code); return {html: c ? src(env, c, esc(c.value.name)) : "—"}; };
  const groups = [
    ["Identity", [["Org. no.", env => ({html: esc(env.organisation_number)})], ["Legal form", text("legal_identity", "legal_form")], ["Municipality", text("legal_identity", "municipality")],
      ["Industry", text("legal_identity", "industry", c => esc(c.value?.beskrivelse || "—"))], ["Founded", text("legal_identity", "founded_date")]]],
    ["Latest filed accounts (NOK)", [["Financial year", env => { const c = latest(env, "revenue") || latest(env, "annual_result"); return {html: c ? `<span title="${esc(c.reporting_period.replace("..", " to "))}">${esc(c.reporting_period.slice(-10, -6))}</span>` : "—"}; }],
      ["Revenue", amount("revenue"), true], ["Operating result", amount("operating_result"), true], ["Net result", amount("annual_result"), true], ["Equity", amount("equity"), true]]],
    ["People", [["Registered employees", env => { const c = pick(env, "legal_identity", "registered_employees")[0]; return {html: c ? src(env, c, esc(c.value)) : "—", n: c ? Number(c.value) : null}; }, true],
      ["CEO", role("DAGL")], ["Chair", role("LEDE")], ["Workplaces", env => ({html: pick(env, "registered_workplaces", "registered_workplace").length || "—"})]]],
    ["Presence and activity", [["Website", env => { const c = pick(env, "official_website", "official_website")[0]; return {html: c ? `${link(c.value, host(c.value))} <span class="sub">${src(env, c, "evidence")}</span>` : badge(env.availability?.official_website || "not_available")}; }],
      ["Profiles", env => { const cs = (env.claims||[]).filter(c => c.family === "company_profiles" && !c.stale && !c.alias_of); return {html: cs.length ? cs.map(c => link(c.value, c.platform || c.field)).join(", ") : badge(env.availability?.company_profiles || "not_available")}; }],
      ["Open jobs", env => { const n = pick(env, "jobs", "open_job").length, cp = pick(env, "jobs", "hiring_signal").filter(c => c.signal === "careers_page")[0]; return {html: n || (cp ? link(cp.value, "careers page") : badge(env.availability?.jobs || "not_available"))}; }],
      ["Changes since last run", env => ({html: (env.changes||[]).length})]]],
  ];
  $("#app").innerHTML = `<nav class="crumbs" aria-label="Breadcrumb"><a href="${listHash()}">← All companies</a></nav>
    <h1 class="sr-only">Compare ${envs.length} companies</h1>
    <p class="meta"><span>Comparing ${envs.length} companies. Values link to their evidence; the highest figure in a row is bold.</span></p>
    <div class="card cmp-wrap"><table class="cmp"><thead><tr><th scope="col"><span class="sr-only">Field</span></th>${envs.map(e => `<th scope="col"><div class="colhead"><a href="#/c/${esc(e.organisation_number)}">${esc(e.legal_name)}</a>${envs.length > 2 ? `<button class="x" data-remove="${esc(e.organisation_number)}" aria-label="Remove ${esc(e.legal_name)} from comparison">${ICON_X}</button>` : ""}</div></th>`).join("")}</tr></thead>
    <tbody>${groups.map(([title, lines]) => `<tr class="group"><th colspan="${envs.length + 1}" scope="colgroup">${title}</th></tr>` + lines.map(([label, fn, numeric]) => { const cells = envs.map(fn); const max = numeric ? Math.max(...cells.map(c => c.n ?? -Infinity)) : null;
      return `<tr><th scope="row">${label}</th>${cells.map(c => { const top = numeric && envs.length > 1 && c.n != null && c.n === max && cells.filter(x => x.n === max).length === 1; return `<td class="${top ? "top" : ""}">${c.html}${top ? '<span class="sr-only"> (highest)</span>' : ""}</td>`; }).join("")}</tr>`; }).join("")).join("")}</tbody></table></div>`;
  $$("[data-remove]").forEach(b => b.onclick = () => { selected.delete(b.dataset.remove); location.hash = `#/compare/${orgs.filter(o => o !== b.dataset.remove).join(",")}`; });
  updateBar();
}

// ---------- routing
async function route() {
  const h = location.hash.slice(1), prev = lastKind;
  if (prev === "list") listScroll = scrollY;  // the list is still on screen here, so this is where the reader left it
  let m, kind = "list";
  try {
    if ((m = h.match(/^\/c\/(\d{9})(?:\/(cl-[0-9a-f]+))?/))) {
      kind = lastKind = "company:" + m[1];
      if (prev !== kind) { currentAsk = null; await renderCompany(m[1]); }
      if (m[2]) revealClaim(m[2]); else if (prev !== kind) scrollTo(0, 0);
      const ask = !m[2] && new URLSearchParams(h.split("?")[1] || "").get("ask");  // a shared question link: #/c/<org>?ask=...
      if (ask && currentAsk) currentAsk(ask, prev === kind);
    } else if ((m = h.match(/^\/compare\/([\d,]+)/))) {
      currentAsk = null;
      kind = lastKind = "compare";
      const orgs = [...new Set(m[1].split(",").filter(o => /^\d{9}$/.test(o)))].slice(0, MAX_COMPARE);
      selected = new Set(orgs);
      await renderCompare(orgs); scrollTo(0, 0);
    } else {
      currentAsk = null;
      readListHash(h);
      lastKind = kind;
      renderList();
      scrollTo(0, prev && prev !== "list" ? listScroll : 0);
    }
  } catch (err) {
    $("#app").innerHTML = `<div class="card empty"><h2>This page could not be loaded</h2><p>${esc(err.message)}</p><div class="actions"><a class="btn" href="#/">Back to all companies</a></div></div>`;
  }
  const changed = prev !== kind || kind === "compare";
  lastKind = kind;
  updateBar();
  if (changed && document.activeElement !== $("#q") && !/\/cl-/.test(h)) ($("#app h1[tabindex]") || $("#app")).focus({preventScroll: true});
}
let typing;
$("#q").oninput = e => {
  state.q = e.target.value;
  clearTimeout(typing);
  typing = setTimeout(() => { if (lastKind === "list") listChanged(); else location.hash = listHash(); }, 120);
};
addEventListener("keydown", e => { if (e.key === "/" && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName) && !e.ctrlKey && !e.metaKey) { e.preventDefault(); $("#q").focus(); } });
addEventListener("click", e => $$("details.menu[open]").forEach(d => { if (!d.contains(e.target)) d.open = false; }));
addEventListener("keydown", e => { if (e.key === "Escape") $$("details.menu[open]").forEach(d => { d.open = false; $("summary", d).focus(); }); });
addEventListener("hashchange", route);
load();
</script>
